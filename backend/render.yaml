# Render.com Free Tier Deployment
# https://render.com

services:
  - type: web
    name: careerflow-sg-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_API_KEY
        sync: false  # You'll set this in Render dashboard
      - key: INVITE_CODES
        value: careerflow2026,hackathon,metaai
      - key: PORT
        value: "10000"
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
